name: Enable Existing Executive Account View

on:
  push:
    paths:
      - 'scripts/enable-existing-executive-account-view.py'
      - '.github/workflows/enable-existing-executive-account-view.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply compatibility update
        run: python scripts/enable-existing-executive-account-view.py
      - name: Syntax-check Generation 3
        run: node --check src/generation3.js
      - name: Commit compatibility update
        run: |
          if git diff --quiet -- src/generation3.js; then
            echo 'Compatibility update already applied.'
            exit 0
          fi
          git config user.name 'Cognitus Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/generation3.js
          git commit -m 'Allow existing executives to view all accounts'
          git push
