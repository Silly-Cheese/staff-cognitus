name: Upgrade Executive Registry

on:
  push:
    paths:
      - '.github/workflows/upgrade-executive-registry.yml'
      - 'scripts/upgrade-executive-registry.py'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply executive registry upgrade
        run: python scripts/upgrade-executive-registry.py
      - name: Validate JavaScript syntax
        run: node --check src/generation3.js
      - name: Commit upgrade
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "Cognitus Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/generation3.js
          git commit -m "Upgrade executive account and organization registry"
          git push
