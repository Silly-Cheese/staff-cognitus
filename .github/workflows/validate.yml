name: Validate Cognitus Staff / Command

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/generation2.js
          node --check src/firebase.js
          node --check src/utils.js
          node --check src/config/departments.js
          node --check src/config/permissions.js
      - name: Verify Generation 2 integration
        run: |
          grep -q 'src/generation2.js' index.html
          grep -q 'COMMAND_GENERATION_2_BEGIN' firestore.command.g2.rules.fragment
          grep -q 'match /commandTasks/{taskId}' firestore.command.g2.rules.fragment
          grep -q 'match /commandRequests/{requestId}' firestore.command.g2.rules.fragment
          grep -q 'match /commandLifecycle/{recordId}' firestore.command.g2.rules.fragment
          grep -q 'match /commandFinance/{entryId}' firestore.command.g2.rules.fragment
          grep -q 'match /commandPayroll/{statementId}' firestore.command.g2.rules.fragment
          grep -q 'match /commandTickets/{ticketId}' firestore.command.g2.rules.fragment
      - name: Enforce no-composite-index policy
        run: |
          test ! -f firestore.indexes.json
          if grep -R "firestore:indexes" -n . --exclude-dir=.git --exclude='.github/workflows/validate.yml'; then
            echo "Composite index deployment reference found."
            exit 1
          fi
      - name: Verify shared Firebase project
        run: |
          grep -q 'projectId: "cognitus-solutions"' src/config/firebaseConfig.js
      - name: Verify staff security boundary is present in rule fragment
        run: |
          grep -q 'match /staffAccess/{uid}' firestore.command.rules.fragment
          grep -q 'match /staffDirectory/{uid}' firestore.command.rules.fragment
          grep -q 'match /staffEmployment/{uid}' firestore.command.rules.fragment
