name: Validate Cognitus Staff / Command

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/extensions-loader-v4.js
          node --check src/command-v4.js
          node --check src/generation2.js
          node --check src/generation3.js
          node --check src/firebase.js
          node --check src/utils.js
          node --check src/config/departments.js
          node --check src/config/permissions.js
      - name: Verify consolidated V4 runtime
        run: |
          grep -q 'src/app.js' index.html
          grep -q 'src/extensions-loader-v4.js' index.html
          grep -q 'src/command-v4.js' index.html
          grep -q 'generation2.js' src/extensions-loader-v4.js
          grep -q 'generation3.js' src/extensions-loader-v4.js
          if grep -q 'src/portal-overhaul.js' index.html; then
            echo "Legacy portal-overhaul runtime is still active."
            exit 1
          fi
          if grep -q 'src/department-command-v2.js' index.html; then
            echo "Legacy department-command-v2 runtime is still active."
            exit 1
          fi
      - name: Verify Generation 2 integration
        run: |
          grep -q 'COMMAND_GENERATION_2_BEGIN' firestore.command.g2.rules.fragment
          grep -q 'match /commandTasks/{taskId}' firestore.command.g2.rules.fragment
          grep -q 'match /commandRequests/{requestId}' firestore.command.g2.rules.fragment
          grep -q 'match /commandLifecycle/{recordId}' firestore.command.g2.rules.fragment
          grep -q 'match /commandFinance/{entryId}' firestore.command.g2.rules.fragment
          grep -q 'match /commandPayroll/{statementId}' firestore.command.g2.rules.fragment
          grep -q 'match /commandTickets/{ticketId}' firestore.command.g2.rules.fragment
      - name: Verify Generation 3 integration
        run: |
          grep -q 'COMMAND_GENERATION_3_BEGIN' firestore.command.g3.rules.fragment
          grep -q 'match /commandCases/{caseId}' firestore.command.g3.rules.fragment
          grep -q 'match /commandEvidence/{evidenceId}' firestore.command.g3.rules.fragment
          grep -q 'match /commandAccreditations/{recordId}' firestore.command.g3.rules.fragment
          grep -q 'match /commandQaReviews/{reviewId}' firestore.command.g3.rules.fragment
          grep -q 'match /commandPrCampaigns/{campaignId}' firestore.command.g3.rules.fragment
          grep -q 'match /commandCsMacros/{macroId}' firestore.command.g3.rules.fragment
          grep -q 'match /commandExecutiveApprovals/{approvalId}' firestore.command.g3.rules.fragment
          grep -q 'Background checks remain automatic' src/generation3.js
      - name: Enforce no-composite-index policy
        run: |
          test ! -f firestore.indexes.json
          if grep -R "firestore:indexes" -n . --exclude-dir=.git --exclude='validate.yml'; then
            echo "Composite index deployment reference found."
            exit 1
          fi
          if grep -R "orderBy(" -n src/command-v4.js src/extensions-loader-v4.js; then
            echo "V4 must sort locally instead of requiring composite indexes."
            exit 1
          fi
      - name: Verify shared Firebase project
        run: |
          grep -q 'projectId: "cognitus-solutions"' src/config/firebaseConfig.js
      - name: Verify staff security boundary is present in rule fragment
        run: |
          grep -q 'match /staffAccess/{uid}' firestore.command.rules.fragment
          grep -q 'match /staffDirectory/{uid}' firestore.command.rules.fragment
          grep -q 'match /staffEmployment/{uid}' firestore.command.rules.fragment
      - name: Verify Generation 3 privilege boundaries
        run: |
          grep -q 'REPORTS_REVIEW: "reports.review"' src/config/permissions.js
          grep -q "staffPermission('cases.manage')" firestore.command.g3.rules.fragment
          grep -q "staffPermission('evidence.manage')" firestore.command.g3.rules.fragment
          grep -q "staffPermission('qa.manage')" firestore.command.g3.rules.fragment
          grep -q "staffPermission('pr.approve')" firestore.command.g3.rules.fragment
          grep -q "staffPermission('system.manage')" firestore.command.g3.rules.fragment
